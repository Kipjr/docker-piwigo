name: Deploy
on:
  push:
    branches:
      - dev
    paths:
      - '**'
      - '!.github/workflows/*'
      - '!README.md'
  workflow_dispatch:
    inputs:
      php_version:
        description: "PHP Version"
        required: true
        default: "84"
        type: string
      piwigo_version:
        description: "Piwigo Version"
        required: true
        default: "16.4.0"
        type: string
        
env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set environment variables (workflow)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "PHP_VERSION=${{ inputs.php_version }}" >> $GITHUB_ENV
          echo "PIWIGO_VERSION=${{ inputs.piwigo_version }}" >> $GITHUB_ENV
      - name: Set environment variables (environment)
        if: github.event_name != 'workflow_dispatch' || ( github.event.inputs.php_version == '' &&  github.event.inputs.piwigo_version == '' )
        run: |
          echo "PHP_VERSION=${{ vars.PHP_VERSION }}" >> $GITHUB_ENV
          echo "PIWIGO_VERSION=${{ vars.PIWIGO_VERSION }}" >> $GITHUB_ENV    
      - uses: actions/checkout@v6.0.2

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build piwigo.php
        run: COMPOSE_DOCKER_CLI_BUILD=1 docker compose build piwigo.php
      
      - name: Push piwigo.php
        run: docker compose push


